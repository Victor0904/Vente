<!doctype html>
<html lang="fr" data-title-prefix="Suivre ma commande">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suivre ma commande · Vide-grenier</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a100e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23047857'/%3E%3Cpath d='M6 9h12l-1 9H7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 data-shop-name>Vide-grenier</h1>
        <small data-shop-desc>Seconde main · paiement à la livraison</small>
      </div>
      <a class="btn btn-ghost" href="/"><span id="backIcon"></span>Boutique</a>
    </div>
  </header>

  <main class="track-main">
    <h2>Suivre ma commande</h2>
    <form class="card form track-form" id="trackForm" novalidate>
      <div class="field">
        <label for="code">Code de suivi</label>
        <div class="track-row">
          <input id="code" name="code" class="input code-input" type="text" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="XXXX-XXXX" aria-describedby="codeHint codeError">
          <button type="submit" class="btn btn-primary" id="trackBtn">Rechercher</button>
        </div>
        <span class="hint" id="codeHint">Le code à 8 caractères affiché à la fin de votre commande.</span>
        <p class="field-error" id="codeError"></p>
      </div>
    </form>

    <section aria-labelledby="mineTitle" id="mine" hidden>
      <h2 id="mineTitle">Vos commandes sur cet appareil</h2>
      <div class="list" id="mineList" aria-live="polite"></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="suivi.js"></script>
</body>
</html>
